name: Propagate Labels from Merged PRs

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  propagate_labels:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: "label-propagation-${{ github.event.pull_request.base.ref }}"
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: checkout branch
        uses: actions/checkout@v4

      - name: Get labels from merged PR
        id: get_source_labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Labels to exclude from propagation (add labels here as needed)
          EXCLUDED_LABELS=(
            # Example: "WIP"
            # Example: "do-not-merge"
          )

          # Get all labels from the merged PR as JSON array
          SOURCE_LABELS_JSON=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')

          # Convert to newline-delimited list and filter out excluded labels
          SOURCE_LABELS=""
          while IFS= read -r label; do
            if [[ -z "$label" ]]; then
              continue
            fi

            # Check if label is in exclusion list
            excluded=false
            for excluded_label in "${EXCLUDED_LABELS[@]}"; do
              if [[ "$label" == "$excluded_label" ]]; then
                excluded=true
                break
              fi
            done

            if [[ "$excluded" == "false" ]]; then
              if [[ -z "$SOURCE_LABELS" ]]; then
                SOURCE_LABELS="$label"
              else
                SOURCE_LABELS="$SOURCE_LABELS"$'\n'"$label"
              fi
            fi
          done <<< "$SOURCE_LABELS_JSON"

          # Export for next steps (use delimiter for multiline)
          echo "SOURCE_LABELS<<EOF" >> $GITHUB_OUTPUT
          echo "$SOURCE_LABELS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Source PR #$PR_NUMBER labels: $SOURCE_LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find target PR
        id: find_target_pr
        run: |
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}
          
          # Find an open PR whose head branch is the base branch of the merged PR
          TARGET_PR=$(gh pr list --head "$BASE_BRANCH" --state open --json number -q '.[0].number')

          if [[ -n "$TARGET_PR" ]]; then
            echo "TARGET_PR=$TARGET_PR" >> $GITHUB_OUTPUT
            echo "Found target PR #$TARGET_PR with head branch '$BASE_BRANCH'"
          else
            echo "No open PR found with head branch '$BASE_BRANCH'"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels to add
        id: compute_labels
        if: steps.find_target_pr.outputs.TARGET_PR != ''
        run: |
          TARGET_PR=${{ steps.find_target_pr.outputs.TARGET_PR }}
          SOURCE_LABELS="${{ steps.get_source_labels.outputs.SOURCE_LABELS }}"

          # Get existing labels on target PR
          TARGET_LABELS_JSON=$(gh pr view "$TARGET_PR" --json labels -q '.labels[].name')

          # Convert target labels to newline-delimited list
          TARGET_LABELS=""
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              if [[ -z "$TARGET_LABELS" ]]; then
                TARGET_LABELS="$label"
              else
                TARGET_LABELS="$TARGET_LABELS"$'\n'"$label"
              fi
            fi
          done <<< "$TARGET_LABELS_JSON"

          # Compute labels to add (source labels not already on target)
          LABELS_TO_ADD=""
          while IFS= read -r source_label; do
            if [[ -z "$source_label" ]]; then
              continue
            fi

            # Check if this label already exists on target
            already_exists=false
            while IFS= read -r target_label; do
              if [[ "$source_label" == "$target_label" ]]; then
                already_exists=true
                break
              fi
            done <<< "$TARGET_LABELS"

            if [[ "$already_exists" == "false" ]]; then
              if [[ -z "$LABELS_TO_ADD" ]]; then
                LABELS_TO_ADD="$source_label"
              else
                LABELS_TO_ADD="$LABELS_TO_ADD"$'\n'"$source_label"
              fi
            fi
          done <<< "$SOURCE_LABELS"

          # Export results
          echo "LABELS_TO_ADD<<EOF" >> $GITHUB_OUTPUT
          echo "$LABELS_TO_ADD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if there are any labels to add
          if [[ -n "$LABELS_TO_ADD" ]]; then
            echo "HAS_LABELS_TO_ADD=true" >> $GITHUB_OUTPUT
            echo "Labels to add: $LABELS_TO_ADD"
          else
            echo "HAS_LABELS_TO_ADD=false" >> $GITHUB_OUTPUT
            echo "No new labels to add"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add labels to target PR
        if: steps.compute_labels.outputs.HAS_LABELS_TO_ADD == 'true'
        run: |
          TARGET_PR=${{ steps.find_target_pr.outputs.TARGET_PR }}
          LABELS_TO_ADD="${{ steps.compute_labels.outputs.LABELS_TO_ADD }}"

          # Convert newline-delimited labels to comma-separated for gh CLI
          LABELS_CSV=$(echo "$LABELS_TO_ADD" | tr '\n' ',' | sed 's/,$//')

          echo "Adding labels to PR #$TARGET_PR: $LABELS_CSV"
          gh pr edit "$TARGET_PR" --add-label "$LABELS_CSV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post comment on target PR
        if: steps.compute_labels.outputs.HAS_LABELS_TO_ADD == 'true'
        run: |
          TARGET_PR=${{ steps.find_target_pr.outputs.TARGET_PR }}
          SOURCE_PR=${{ github.event.pull_request.number }}
          LABELS_TO_ADD="${{ steps.compute_labels.outputs.LABELS_TO_ADD }}"

          # Format labels as markdown inline code
          LABELS_MARKDOWN=""
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then
              if [[ -z "$LABELS_MARKDOWN" ]]; then
                LABELS_MARKDOWN="\`$label\`"
              else
                LABELS_MARKDOWN="$LABELS_MARKDOWN, \`$label\`"
              fi
            fi
          done <<< "$LABELS_TO_ADD"

          # Create comment body
          COMMENT_BODY="🏷️ **Labels propagated from merged PR**

          The following labels were added from #${SOURCE_PR}:
          ${LABELS_MARKDOWN}"

          echo "Posting comment to PR #$TARGET_PR"
          gh pr comment "$TARGET_PR" --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
